# Project 2 configuration. Every analytic choice that is not data-driven lives here.
# Edits after the test set is first scored must be logged in docs/DECISIONS.md.

project:
  name: "Missingness provenance in youth suicide-attempt prediction (YRBS)"
  short: p2-yrbs-provenance
  seed: 20261004

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results
  figures: figures
  tables: tables

yrbs:
  # Candidate window. The FINAL window is set by scripts/03_audit_years.py
  # (rules in docs/protocol.md section 4) and written to results/audit/window.json.
  candidate_years: [2015, 2017, 2019, 2021, 2023]
  sadc_release: 2023
  base_url: "https://www.cdc.gov/yrbs/files/sadc_2023/HS"
  data_files:
    - sadc_2023_national.dat
    - sadc_2023_district.dat
    - sadc_2023_state_a_d.dat
    - sadc_2023_state_e_h.dat
    - sadc_2023_state_i_l.dat
    - sadc_2023_state_m.dat
    - sadc_2023_state_n_p.dat
    - sadc_2023_state_q_t.dat
    - sadc_2023_state_u_z.dat
  sas_input_program: 2023-SADC-SAS-Input-Program.sas
  sas_format_program: 2023-SADC-SAS-Formats-Program.sas
  documentation_url: "https://www.cdc.gov/yrbs/media/pdf/2023/2023-YRBS-SADC-Documentation.pdf"

  # Design variables, names per 2023 SADC User's Guide (verified 2026-10-04).
  design:
    site: sitecode
    site_name: sitename
    site_type: sitetype      # District / State / National
    year: year
    weight: weight
    stratum: stratum
    psu: psu

  # Outcomes, verified against 2023 SADC User's Guide (Q29, Q30; QN29, QN30).
  outcomes:
    any_attempt:
      raw_var: q29        # A=0 times .. E=6+ times (coded 1..5)
      positive_codes: [2, 3, 4, 5]
      valid_codes: [1, 2, 3, 4, 5]   # verified vs $H29S 2026-10-10
    injurious_attempt:
      raw_var: q30        # A=did not attempt, B=yes, C=no (coded 1..3)
      positive_codes: [2]
      valid_codes: [1, 2, 3]   # verified vs $H30S 2026-10-10

  # Same-construct items excluded from the primary predictor set (sensitivity S-PROX adds them).
  proximal_items: [qn27, qn28]   # CDC QN27 considered, QN28 plan (User's Guide)

  # Predictor CONCEPTS. Variable names are resolved from the CDC SAS input program
  # labels by scripts/02_resolve_variables.py, and the resolved map must be checked by
  # the author (docs/VERIFICATION.md item V3). Nothing here hard-codes a question number
  # except where the User's Guide was read directly.
  predictor_concepts:
    sad_hopeless:      "sad or hopeless"
    bullied_school:    "bullied on school property"
    bullied_electronic: "electronically bullied"
    fight:             "physical fight"
    weapon:            "carried a weapon"
    forced_sex:        "physically forced to have sexual intercourse"
    dating_violence:   "physically hurt.*dating"
    unsafe_skip:       "felt.*unsafe|did not go to school because"
    alcohol_current:   "current.*alcohol|drink.*alcohol.*past 30|had at least one drink"
    marijuana_current: "used marijuana.*past 30|currently used marijuana"
    vape_current:      "electronic vapor"
    cig_current:       "smoked cigarettes"
    rx_opioid:         "prescription pain medicine|prescription opioid"
    sleep:             "hours of sleep"
    grades:            "grades in school"
  demographic_vars: [age, sex, grade, race7, sexid]
  # Structural not-applicable: CDC sets the QN indicator to missing for these respondents.
  # Verified against 2023-SADC-SAS-Formats-Program ($H22S "1" = Did not date). Coded OBS_NONSUB.
  not_applicable:
    qn22: {raw: q22, codes: [1]}

splits:
  # Primary: PH-MissBench frozen YRBS split if compatible (see docs/protocol.md 6.1);
  # otherwise P2-internal survey-stratified split, frozen on first creation.
  phmissbench_split_file: data/external/phmissbench_yrbs_split.parquet
  internal:
    train: 0.6
    valid: 0.2
    test: 0.2
  sensitivity_structures: [leave_sites_out, temporal_last_year]

evaluation:
  bootstrap_reps: 1000        # PSU-within-stratum bootstrap on the test set
  bootstrap_reps_dev: 200     # sensitivity scenarios on the MacBook (--dev); primary uses bootstrap_reps
  thresholds:                 # all chosen on VALIDATION, applied to test
    - {name: sens80, rule: target_sensitivity, value: 0.80}
    - {name: top10, rule: top_fraction, value: 0.10}
    - {name: top5, rule: top_fraction, value: 0.05}
  calibration_bins: 10
  subgroups: [sex, grade, race7, sexid, site_type, year]
  min_subgroup_events: 30
