[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2prov"
version = "0.1.0"
description = "Missingness provenance in YRBS suicide-attempt prediction (Project 2)"
authors = [{name = "Selorm Buaka", email = "othnielbuaka@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8", "pyarrow>=14", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
